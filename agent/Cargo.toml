[package]
version = "0.17.0"
name = "yeet-agent"
categories.workspace = true
edition.workspace = true
repository.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
description = "Pull-based NixOs deployment agent"

[dependencies]
serde_json = "1.0"
api = { path = "../api", package="yeet-api"}
notify-rust = "4.11"
tokio = { version = "1.49", features = ["full"] } # TODO: maybe switch to smoll?

backon = "1.6.0"
tempfile = "3.23.0"
shadow-rs = { version = "1.5", default-features = false }
zlink = { version = "0.4.0", features= ["idl", "introspection"] }
nix = {version = "0.31", features = ["user","fs"]}

httpsig-hyper.workspace = true
serde.workspace = true
ed25519-dalek = { workspace = true , features = ["serde", "pem", "pkcs8"]}
thiserror.workspace = true
url.workspace = true
color-eyre.workspace = true
tracing.workspace = true
# tracing-subscriber.workspace = true
# tracing-error.workspace = true

# TODO: ssh-agent-client-rs = "1.1.2"

[build-dependencies]
shadow-rs = "1.5"

[lints]
workspace = true
