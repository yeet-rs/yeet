[package]
version = "0.17.0"
name = "yeet"
categories.workspace = true
edition.workspace = true
repository.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
description = "Pull-based NixOs deployment agent"

[dependencies]
serde_json = "1.0"
api = { path = "../api", package="yeet-api"}
clap = { version = "4.6", features = ["derive","string"] }
tokio = { version = "1.49", features = ["full"] } # TODO: maybe switch to smoll?

xdg = "3.0.0"
shadow-rs = { version = "1.5", default-features = false }
nix = {version = "0.31", features = ["user","fs"]}
inquire = "0.9.1"
ssh2-config = "0.7"

figment.workspace = true
httpsig-hyper.workspace = true
reqwest.workspace = true
jiff.workspace = true
serde.workspace = true
ed25519-dalek = { workspace = true , features = ["serde", "pem", "pkcs8"]}
url.workspace = true

color-eyre.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-error.workspace = true
yeet-agent = {path = "../agent"}
owo-colors.workspace = true


# TODO: ssh-agent-client-rs = "1.1.2"

[build-dependencies]
shadow-rs = "1.5"

[lints]
workspace = true
